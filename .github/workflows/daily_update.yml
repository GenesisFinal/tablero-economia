name: Actualización Automática de Indicadores Económicos

on:
  schedule:
    # 4 barridos diarios: 06:00, 10:00, 14:00 y 18:00 ART (09:00, 13:00, 17:00, 21:00 UTC)
    - cron: '0 9,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Barrido y Actualización de Fuentes Oficiales
        run: |
          python actualizar_datos.py

      - name: Compilación del Tablero Web
        run: |
          python build_html.py

      - name: Commit y Publicación Automática
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_dataset.json index.html actualizar_datos.py build_html.py requirements.txt
          if git diff --staged --quiet; then
            echo "Todos los datos se encuentran al día. Sin cambios pendientes."
          else
            git commit -m "Auto-update: Sincronización oficial de indicadores $(date -u +'%Y-%m-%d %H:%M:%S UTC') [skip ci]"
            git push
          fi
